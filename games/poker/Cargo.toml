[workspace]
members = ["engine", "mental", "programs/riverproof", "tests"]
# `tests/` runs the compiled program in an in-process SVM. It needs
# `anchor build` to have produced `target/deploy/riverproof.so` first, which is
# why `pnpm chain:test` builds before it tests. See program/tests/README.md.
resolver = "2"

# The mental-poker tests do tens of thousands of scalar multiplications, and an
# unoptimised curve library turns a fast suite into a slow one. Optimising only
# the dependency keeps our own code debuggable.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
