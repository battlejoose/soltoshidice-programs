[toolchain]
anchor_version = "1.0.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
riverproof = "3EB6JJ2k1yPdg9qokViBdSWq4jaEVG4wiKbS8Pw3FmWQ"

[programs.devnet]
riverproof = "3EB6JJ2k1yPdg9qokViBdSWq4jaEVG4wiKbS8Pw3FmWQ"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# Devnet deploys need a dedicated RPC. Arcium's docs are explicit that the
# default endpoints drop deployment transactions for a program this size.
# [provider]
# cluster = "https://your-devnet-endpoint"
# wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 600000 tests-ts/devnet-smoke.ts"
