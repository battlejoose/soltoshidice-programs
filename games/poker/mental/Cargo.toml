[package]
name = "riverproof-mental"
version = "0.1.0"
edition = "2021"
description = "Mental poker: a deck the players shuffle, and open, themselves"

[dependencies]
curve25519-dalek = "4.1.3"
sha2 = "0.10"

[dev-dependencies]
riverproof-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
