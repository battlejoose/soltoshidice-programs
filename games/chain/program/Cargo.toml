[package]
name = "hooddice-bank"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=2.3.0"
spl-token-2022 = { version = "=8.0.1", features = ["no-entrypoint"] }
borsh = { version = "1.5.7", features = ["derive"] }
sdice-slots-rules = { path = "../slots-rules" }

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
