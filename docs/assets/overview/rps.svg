78" rx="11" fill="#1a2d31" stroke="#334b4f"/><text x="579" y="151" font-size="16" fill="#65e6c4" font-weight="700" letter-spacing="1">REVEAL</text><text x="579" y="179" font-size="15" fill="#d3dfd9" >Check both commitments</text><path d="M803 163L817 163" stroke="#65e6c4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="822" y="124" width="235" height="78" rx="11" fill="#1a2d31" stroke="#334b4f"/><text x="838" y="151" font-size="16" fill="#65e6c4" font-weight="700" letter-spacing="1">SCORE + PAY</text><text x="838" y="179" font-size="15" fill="#d3dfd9" >Best-of + timeout rules</text><text x="304" y="244" font-size="16" fill="#a8c0ba" >RPS program · player-choice fairness · no randomness oracle needed</text></g></svg>
