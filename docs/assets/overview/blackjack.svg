<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc"><title id="title">BLACKJACK: how it works</title><desc id="desc">Six decks. One shared dealer. Hit, stand, double or split. FUND + BET: Player table escrow. DRAW + PLAY: MagicBlock base-layer VRF. RESOLVE: Escrow credit → cash out. Bank program · request-bound card draws · no rollup delegation</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7dbfff"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="1118" height="278" rx="18" fill="#101d21" stroke="#334b4f"/><path d="M280 25V255" stroke="#334b4f"/><circle cx="140" cy="140" r="98" fill="#7dbfff" opacity=".08"/><g transform="translate(104 137) rotate(-10)"><rect x="-37" y="-53" width="74" height="106" rx="8" fill="#fff4d5" stroke="none"/><text x="-26" y="-23" font-size="26" fill="#142327" font-weight="700">A</text><text x="0" y="25" font-size="42" fill="#142327" text-anchor="middle">♠</text></g><g transform="translate(173 140) rotate(10)"><rect x="-37" y="-53" width="74" height="106" rx="8" fill="#fff4d5" stroke="none"/><text x="-26" y="-23" font-size="26" fill="#142327" font-weight="700">J</text><text x="0" y="25" font-size="42" fill="#e46e71" text-anchor="middle">♥</text></g><rect x="100" y="211" width="80" height="35" rx="17" fill="#7dbfff" stroke="none"/><text x="140" y="237" font-size="26" fill="#122125" text-anchor="middle" font-weight="800">21</text><text x="304" y="53" font-size="29" fill="#7dbfff" font-weight="800" letter-spacing="1">BLACKJACK</text><text x="304" y="87" font-size="18" fill="#d3dfd9" >Six decks. One shared dealer. Hit, stand, double or split.</text><rect x="304" y="124" width="235" height="78" rx="11" fill="#1a2d31" stroke="#334b4f"/><text x="320" y="151" font-size="16" fill="#7dbfff" font-weight="700" letter-spacing="1">FUND + BET</text><text x="320" y="179" font-size="15" fill="#d3dfd9" >Player table escrow</text><path d="M544 163L558 163" stroke="#7dbfff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="563" y="124" width="235" height="78" rx="11" fill="#1a2d31" stroke="#334b4f"/><text x="579" y="151" font-size="16" fill="#7dbfff" font-weight="700" letter-spacing="1">DRAW + PLAY</text><text x="579" y="179" font-size="15" fill="#d3dfd9" >MagicBlock base-layer VRF</text><path d="M803 163L817 163" stroke="#7dbfff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="822" y="124" width="235" height="78" rx="11" fill="#1a2d31" stroke="#334b4f"/><text x="838" y="151" font-size="16" fill="#7dbfff" font-weight="700" letter-spacing="1">RESOLVE</text><text x="838" y="179" font-size="15" fill="#d3dfd9" >Escrow credit → cash out</text><text x="304" y="244" font-size="16" fill="#a8c0ba" >Bank program · request-bound card draws · no rollup delegation</text></g></svg>
