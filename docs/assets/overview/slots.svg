<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc"><title id="title">LUCKY BLOCK: how it works</title><desc id="desc">Three reels, one payline and an explicit versioned paytable. SPIN: Lock SDICE wager. DRAW REELS: MagicBlock base-layer VRF. SETTLE: Bank pays the result. Bank program · 96% theoretical RTP · deterministic reel mapping</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b398fb"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="1118" height="278" rx="18" fill="#101d21" stroke="#334b4f"/><path d="M280 25V255" stroke="#334b4f"/><circle cx="140" cy="140" r="98" fill="#b398fb" opacity=".08"/><rect x="51" y="63" width="178" height="174" rx="16" fill="#293b41" stroke="#b398fb"/><text x="140" y="91" font-size="17" fill="#b398fb" text-anchor="middle" font-weight="700">LUCKY BLOCK</text><rect x="76" y="110" width="40" height="64" rx="6" fill="#fff4d5" stroke="none"/><text x="96" y="153" font-size="38" fill="#dc6370" text-anchor="middle" font-weight="800">7</text><rect x="124" y="110" width="40" height="64" rx="6" fill="#fff4d5" stroke="none"/><text x="144" y="153" font-size="38" fill="#dc6370" text-anchor="middle" font-weight="800">7</text><rect x="172" y="110" width="40" height="64" rx="6" fill="#fff4d5" stroke="none"/><text x="192" y="153" font-size="38" fill="#dc6370" text-anchor="middle" font-weight="800">7</text><path d="M65 142L216 142" stroke="#b398fb" stroke-width="3" fill="none" opacity=".3"/><rect x="77" y="195" width="124" height="23" rx="10" fill="#b398fb" stroke="none"/><path d="M231 151L246 111" stroke="#b398fb" stroke-width="3" fill="none" /><circle cx="248" cy="105" r="11" fill="#b398fb"/><text x="304" y="53" font-size="29" fill="#b398fb" font-weight="800" letter-spacing="1">LUCKY BLOCK</text><text x="304" y="87" font-size="18" fill="#d3dfd9" >Three reels, one payline and an explicit versioned paytable.</text><rect x="304" y="124" width="235" height="78" rx="11" fill="#1a2d31" stroke="#334b4f"/><text x="320" y="151" font-size="16" fill="#b398fb" font-weight="700" letter-spacing="1">SPIN</text><text x="320" y="179" font-size="15" fill="#d3dfd9" >Lock SDICE wager</text><path d="M544 163L558 163" stroke="#b398fb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="563" y="124" width="235" height="78" rx="11" fill="#1a2d31" stroke="#334b4f"/><text x="579" y="151" font-size="16" fill="#b398fb" font-weight="700" letter-spacing="1">DRAW REELS</text><text x="579" y="179" font-size="15" fill="#d3dfd9" >MagicBlock base-layer VRF</text><path d="M803 163L817 163" stroke="#b398fb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="822" y="124" width="235" height="78" rx="11" fill="#1a2d31" stroke="#334b4f"/><text x="838" y="151" font-size="16" fill="#b398fb" font-weight="700" letter-spacing="1">SETTLE</text><text x="838" y="179" font-size="15" fill="#d3dfd9" >Bank pays the result</text><text x="304" y="244" font-size="16" fill="#a8c0ba" >Bank program · 96% theoretical RTP · deterministic reel mapping</text></g></svg>
