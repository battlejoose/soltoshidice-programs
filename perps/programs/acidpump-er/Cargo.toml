[package]
name = "acidpump-er"
version = "0.2.0"
edition = "2021"
description = "Acidpump: unsold collateral, PumpSwap loss conversion and USD FIFO"

[lib]
crate-type = ["cdylib", "lib"]
name = "acidpump_er"

[features]
default = ["custom-heap"]
devnet = []
mainnet = []
# Compatibility for retired private-deployment builds; policy comes from the manifest.
mainnet-test = ["mainnet"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
ephemeral-rollups-sdk = { version = "=0.17.3", features = ["anchor", "instruction"] }
solana-instructions-sysvar = "3.0.1"

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
bs58 = "0.5"
curve25519-dalek = "4"

[dev-dependencies]
base64 = "0.22"
sha2 = "0.10"
serde_json = "1"
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

